[project]
name = "ai-workspace-bridge"
version = "0.1.0"
description = "Local bridge between VS Code and AI web interfaces"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "playwright",
    "pyyaml",
    "python-dotenv"
]


[project.optional-dependencies]
dev = [
    "pytest"
]


[build-system]
requires = [
    "setuptools>=68"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = [
  "."
]